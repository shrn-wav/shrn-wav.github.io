<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- $H₹N · press kit · © $H₹N. All rights reserved. [SHRN-WAV-7C41] -->
<title>$H₹N — Press Kit</title>
<meta name="description" content="$H₹N press kit: Madison, WI DJ. Tech house, bass and UK garage with desi roots. Bio, residencies, sets, photos and booking.">
<meta property="og:title" content="$H₹N — Press Kit">
<meta property="og:image" content="assets/og-image.jpg">
<meta name="copyright" content="© $H₹N. All rights reserved.">
<link rel="icon" type="image/png" sizes="64x64" href="assets/brand/favicon-64.png">
<link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800;900&family=Space+Mono:wght@400;700&family=Caveat+Brush&display=swap" rel="stylesheet">
<style>
:root{--ink:#050505;--ink2:#0b0c08;--ink3:#121309;--acid:#D1FA1D;--mid:#9cbb15;--dim:#5f7210;--line:#262c0e;--paper:#e2e5d6;--muted:#8f9878;--hand:#c9d39a;}
*{margin:0;padding:0;box-sizing:border-box;}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
body{background:var(--ink);color:var(--paper);font-family:'Space Mono',monospace;font-size:13px;line-height:1.7;}
a{color:var(--acid);text-decoration:none;}
.page{max-width:1080px;margin:0 auto;padding:40px max(16px,5vw) 70px;}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap;padding-bottom:22px;border-bottom:1px solid var(--line);}
.head img{width:min(380px,78vw);display:block;}
.kicker{font-size:10px;letter-spacing:.32em;color:var(--muted);margin-top:12px;}
.bar{display:flex;gap:8px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.14em;padding:11px 15px;border:1px solid var(--acid);background:var(--acid);color:var(--ink);cursor:pointer;white-space:nowrap;}
.btn.o{background:none;color:var(--acid);}
.btn:hover{box-shadow:0 0 20px rgba(209,250,29,.35);}
h2{font-family:'Grenze Gotisch',serif;font-weight:900;font-size:36px;line-height:1;color:var(--acid);margin:44px 0 16px;}
h2 small{font-family:'Space Mono',monospace;font-weight:400;font-size:10px;letter-spacing:.24em;color:var(--dim);margin-left:12px;vertical-align:middle;}
.intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:34px;margin-top:30px;align-items:start;}
.photo{position:relative;border:1px solid var(--line);overflow:hidden;aspect-ratio:4/5;}
.photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);display:block;}
.photo::after{content:'';position:absolute;inset:0;background:var(--acid);mix-blend-mode:multiply;}
.lead{font-size:15px;line-height:1.8;color:var(--paper);}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-top:20px;}
.nums div{background:var(--ink2);padding:12px 12px 10px;}
.nums b{display:block;font-family:'Grenze Gotisch',serif;font-weight:900;font-size:40px;line-height:.9;color:var(--acid);}
.nums span{font-size:9px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase;}
.facts{display:grid;grid-template-columns:110px 1fr;gap:6px 16px;margin-top:20px;font-size:12px;}
.facts dt{font-size:9px;letter-spacing:.2em;color:var(--dim);padding-top:3px;}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
.res div{border:1px solid var(--line);background:var(--ink2);padding:14px;}
.res b{display:block;font-family:'Grenze Gotisch',serif;font-weight:900;font-size:26px;line-height:1;color:var(--paper);}
.res em{display:block;font-style:normal;font-size:10px;letter-spacing:.16em;color:var(--acid);margin:6px 0 8px;text-transform:uppercase;}
.res p{font-size:11px;color:var(--muted);line-height:1.6;}
.col{border:1px solid var(--acid);padding:18px 20px;background:linear-gradient(135deg,rgba(209,250,29,.08),transparent 60%);}
.col .tag{font-family:'Caveat Brush',cursive;font-size:22px;color:var(--hand);}
.col p{margin-top:6px;max-width:760px;}
.col ul{list-style:none;display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
.col li{font-size:10px;letter-spacing:.14em;border:1px solid var(--dim);padding:4px 9px;color:var(--paper);}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px;}
ul.list{list-style:none;}
ul.list li{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12px;}
ul.list .d{color:var(--dim);font-size:11px;letter-spacing:.08em;}
ul.list b{color:var(--paper);}
ul.list span.w{color:var(--muted);}
.bio p{margin-bottom:12px;max-width:820px;color:var(--paper);}
.photos{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.photos a{display:block;border:1px solid var(--line);}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.photos span{display:block;font-size:9px;letter-spacing:.16em;padding:6px 8px;color:var(--acid);}
.contact{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin-top:44px;padding:20px;border:1px solid var(--line);background:var(--ink2);}
.contact b{font-family:'Grenze Gotisch',serif;font-weight:900;font-size:30px;color:var(--acid);line-height:1;}
.contact .links{display:flex;gap:16px;flex-wrap:wrap;font-size:11px;letter-spacing:.1em;}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none;}
.desi{color:var(--acid);}
.contact .links{gap:10px;}
.contact .links a{display:inline-flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line);color:var(--acid);font-size:12px;letter-spacing:.06em;}
.contact .links a:hover{border-color:var(--acid);background:rgba(209,250,29,.08);}
.foot{margin-top:22px;font-size:10px;color:var(--dim);letter-spacing:.1em;}
@media(max-width:820px){.intro,.two{grid-template-columns:1fr;}.res{grid-template-columns:1fr 1fr;}.photos{grid-template-columns:repeat(3,1fr);}.nums{grid-template-columns:1fr 1fr;}}
@media print{
  @page{size:A4;margin:0;}
  body{font-size:10.5px;}
  .page{padding:12mm 13mm;max-width:none;-webkit-box-decoration-break:clone;box-decoration-break:clone;}
  .noprint{display:none !important;}
  h2{font-size:26px;margin:20px 0 10px;}
  .intro{grid-template-columns:5fr 8fr;gap:20px;margin-top:16px;}
  .photo{aspect-ratio:4/4.6;}
  .lead{font-size:11.5px;line-height:1.65;}
  .nums b{font-size:30px;}
  .res{grid-template-columns:repeat(4,1fr);gap:8px;}
  .res div{padding:10px;}
  .res b{font-size:20px;}
  .two{grid-template-columns:1fr 1fr;gap:20px;}
  ul.list li{padding:4px 0;font-size:10px;grid-template-columns:78px 1fr;}
  .bio,.photos-sec{display:none;}
  .p2{break-before:page;}
  .lead{font-size:11px;line-height:1.6;}
  .facts{margin-top:14px;gap:4px 14px;}
  .nums{margin-top:14px;}
  .contact .links a{padding:6px 9px;font-size:10px;}
  .contact{margin-top:18px;padding:12px 14px;}
  .contact b{font-size:22px;}
  section,.res div,.col,.contact{break-inside:avoid;}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-instagram" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6" fill="currentColor"/></symbol>
  <symbol id="i-soundcloud" viewBox="0 0 24 24"><path d="M9 17V10M6 17v-5M3 17v-3M12 17V8.5c1-.9 2.3-1.5 3.8-1.5 2.9 0 5.2 2.2 5.2 5 0 .2 0 .4-.1.6A2.7 2.7 0 0 1 21 17z"/></symbol>
  <symbol id="i-youtube" viewBox="0 0 24 24"><rect x="2.5" y="5.5" width="19" height="13" rx="4"/><path d="M10 9.3v5.4l4.8-2.7z" fill="currentColor"/></symbol>
  <symbol id="i-twitch" viewBox="0 0 24 24"><path d="M4.5 3.5h16v10.5l-4.5 4.5h-3.5L9.5 21.5v-3H4.5z"/><path d="M11 8v4.5M15.5 8v4.5"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/></symbol>
  <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></symbol>
</svg>
<div class="page">
  <div class="head">
    <div><img src="assets/brand/shrn-logo.svg" alt="$H₹N"><div class="kicker" id="kicker"></div></div>
    <div class="bar noprint" id="bar"></div>
  </div>

  <div class="intro">
    <div class="photo"><img src="assets/press/shrn-press-01.jpg" alt="$H₹N"></div>
    <div>
      <p class="lead" id="lead"></p>
      <div class="nums" id="nums"></div>
      <dl class="facts" id="facts"></dl>
    </div>
  </div>

  <section><h2>Madison <small>RESIDENCIES + SERIES</small></h2><div class="res" id="res"></div></section>

  <section class="p2"><h2>The Collective <small>IN THE MAKING</small></h2><div class="col" id="col"></div></section>

  <section class="two">
    <div><h2>Beyond Madison</h2><ul class="list" id="beyond"></ul></div>
    <div><h2>Archive Tapes <small>LISTEN</small></h2><ul class="list" id="sets"></ul></div>
  </section>

  <section class="bio"><h2>Full bio</h2><div id="bio"></div></section>

  <section class="photos-sec noprint"><h2>Press photos <small>TAP TO DOWNLOAD</small></h2><div class="photos" id="photos"></div><p class="foot" id="pressFolder"></p></section>

  <div class="contact">
    <div><b>Booking</b><div id="mail"></div></div>
    <div class="links" id="links"></div>
  </div>
  <p class="foot">© <span id="yr"></span> $H₹N · all rights reserved · <span id="site"></span></p>
</div>

<script src="content.js"></script>
<script>
const S = window.SITE;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = id => document.getElementById(id);
const MON = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const site = 'shrn-wav.github.io';
const parseD = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); };
const today = new Date(); today.setHours(0,0,0,0);
const shows = S.shows.filter(s => s.date).map(s => ({...s, d: parseD(s.date)}));
const past = shows.filter(s => s.d < today).sort((a,b) => b.d - a.d);
const upcoming = shows.filter(s => s.d >= today).sort((a,b) => a.d - b.d);
const mad = shows.filter(s => /madison/i.test(s.city || ''));
const soc = S.socials.filter(s => s.active && s.url);

$('kicker').textContent = 'OFFICIAL PRESS KIT · ' + S.location + ' · ' + new Date().getFullYear();
$('bar').innerHTML =
  (S.pressKitPdf ? '<a class="btn" href="' + esc(S.pressKitPdf) + '" download>↓ DOWNLOAD PDF</a>' : '<button class="btn" onclick="print()">↓ SAVE AS PDF</button>') +
  (S.pressKitExternal ? '<a class="btn o" href="' + esc(S.pressKitExternal) + '" target="_blank" rel="noopener">FULL PRESS KIT ↗</a>' : '') +
  '<a class="btn o" href="mailto:' + esc(S.email) + '?subject=' + encodeURIComponent('Booking $H₹N') + '">BOOK ✉</a>' +
  '<a class="btn o" href="index.html">WEBSITE</a>';
$('lead').textContent = S.bioShort;

const cities = new Set(past.map(s => /madison/i.test(s.city) ? 'Madison' : /miami/i.test(s.city) ? 'Miami' : /(los angeles|la, ca|malibu|topanga)/i.test(s.city) ? 'LA' : s.city === 'Online' ? null : s.city.split(',')[0]).values());
cities.delete(null);
$('nums').innerHTML = [
  [past.length + '+', 'shows played'],
  [mad.filter(s => s.d < today).length, 'Madison nights'],
  [cities.size, 'cities'],
  [S.sets.length, 'Archive Tapes'],
].map(([b, t]) => '<div><b>' + b + '</b><span>' + t + '</span></div>').join('');

$('facts').innerHTML = [
  ['BASED', 'Madison, WI'],
  ['SOUND', esc(S.genres) + '<br><span class="desi">Desi · Tamil · Hindi</span>'],
  ['PLAYS', 'Clubs, open decks, warehouses, radio, pop-ups and private desi celebrations'],
  ['NEXT UP', upcoming.length ? upcoming.slice(0, 2).map(s => esc(s.tag || s.name) + ' · ' + MON[s.d.getMonth()] + ' ' + s.d.getDate() + ' @ ' + esc(s.venue || s.name)).join('<br>') : 'Dates dropping soon'],
  ['BOOKING', '<a href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a>'],
].map(([k, v]) => '<dt>' + k + '</dt><dd>' + v + '</dd>').join('');

/* Madison residencies, counted from the show list */
const RES = [
  ['Liquid', 'Themed club nights', 'Tech house, baile, hip-hop, dub and UKG across Liquid\'s themed nights: GTA Rave, Nostalgia Night, Thrillaween.'],
  ['Ruby', 'Host · Open Decks', 'Hosts the Open Decks series and plays the London Underground nights. Techno, speed garage, UKG and bass.'],
  ['Local Motive', 'House + disco', 'House and disco sessions, including b2bs with Madison selectors.'],
  ['Nattspil', 'Episode series', 'Acid house, funky house, disco and the occasional rock curveball.'],
];
$('res').innerHTML = RES.map(([n, role, txt]) => { const c = mad.filter(s => (s.loc || s.venue || s.name) === n || s.name === n).length;
  return '<div><b>' + n + '</b><em>' + role + (c ? ' · ' + c + (c === 1 ? ' night' : ' nights') : '') + '</em><p>' + txt + '</p></div>'; }).join('');

const C = S.collective || {};
$('col').innerHTML = '<span class="tag">' + esc(C.name || 'freestyle b2b sessions · livestreams · online radio') + '</span><p>' + esc(C.text || '') + '</p>';

$('beyond').innerHTML = past.filter(s => !/madison/i.test(s.city || '')).slice(0, 10).map(s =>
  '<li><span class="d">' + MON[s.d.getMonth()] + ' ' + s.d.getFullYear() + '</span><span><b>' + esc(s.tag || s.name) + '</b> <span class="w">· ' + esc(s.loc || s.city) + '</span></span></li>').join('');
$('sets').innerHTML = S.sets.map(s => '<li><span class="d">' + esc((s.genres || '').split('·')[0].trim() || 'Live set') + '</span><span><a href="' + esc(s.soundcloud || S.soundcloudProfile) + '"><b>' + esc(s.title) + '</b></a> <span class="w">· ' + esc(s.series || '') + '</span></span></li>').join('');
$('bio').innerHTML = S.bioLong.map(p => '<p>' + esc(p) + '</p>').join('');
$('photos').innerHTML = (S.press || []).map((p, i) => '<a href="' + esc(p) + '" download><img src="' + esc(p) + '" alt="$H₹N press photo ' + (i + 1) + '" loading="lazy"><span>↓ PHOTO ' + String(i + 1).padStart(2, '0') + '</span></a>').join('');
if (S.pressFolder) $('pressFolder').innerHTML = 'Hi-res photos + audio: <a href="' + esc(S.pressFolder) + '">' + esc(S.pressFolder) + '</a>';
$('mail').innerHTML = '<a href="mailto:' + esc(S.email) + '">' + esc(S.email) + '</a>';
const ICO = n => '<svg class="ico" aria-hidden="true"><use href="#i-' + n + '"/></svg>';
$('links').innerHTML = '<a href="mailto:' + esc(S.email) + '" title="Email">' + ICO('mail') + '<span>EMAIL</span></a>' + soc.map(s => '<a href="' + esc(s.url) + '" target="_blank" rel="noopener" title="' + esc(s.name) + ' · ' + esc(s.handle) + '">' + ICO(s.name.toLowerCase()) + '<span>' + esc(s.handle) + '</span></a>').join('') + '<a href="https://' + site + '" title="Website">' + ICO('web') + '<span>' + site + '</span></a>';
$('yr').textContent = new Date().getFullYear(); $('site').textContent = site;
</script>
</body>
</html>
